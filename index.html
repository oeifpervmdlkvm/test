<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Music Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;

            /* Full-page background image */
            background-image: url('background.jpg'); /* Replace with your file name */
            background-size: cover;       /* Cover entire page */
            background-position: center;  /* Center the image */
            background-repeat: no-repeat; /* Don’t repeat the image */
            background-attachment: fixed; /* Keep fixed when scrolling */
        }

        header {
            background-color: rgba(76, 175, 80, 0.9); /* Slightly transparent */
            color: white;
            padding: 30px 0;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 50px 20px;
        }

        .player-container {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent */
            border: 2px solid #ccc;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        audio {
            width: 300px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Music Player</h1>
    </header>

    <main>
        <div class="player-container">
            <h2>je joue maintenant</h2>
            <p>how we love audio.mp3</p>
            <audio controls>
                <source src="howweloveaudio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </main>

</body>
</html>
