<!DOCTYPE html>
<html lang="FR">
<head>
    <meta charset="UTF-8">
    <title>mon page de musique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 30px 0;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 50px 20px;
        }

        .player-container {
            background-color: #fff;
            border: 2px solid #ccc;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        audio {
            width: 300px;
        }
    </style>
</head>
<body>

    <header>
        <h1>mon jouer de musique</h1>
    </header>

    <main>
        <div class="player-container">
            <h2>:je joue maintenant</h2>
            <p>how we love audio.mp3</p>
            <audio controls>
                <source src="howweloveaudio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </main>

</body>
</html>
